; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_V4]
platform = espressif32@6.6.0
board = heltec_wifi_lora_32_V4
framework = arduino
lib_extra_dirs = C:\Users\huval\Documents\Arduino\libraries
board_build.variants_dir = variants
board_build.variant = heltec_V4
board_build.filesystem = littlefs
lib_deps =
	heltecautomation/Heltec ESP32 Dev-Boards
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.0.0 ;@ ^6.21.0
	bitbank2/AnimatedGIF@^2.1.0
build_flags = 
	-D HELTEC_BOARD
	-D WIFI_LORA_32_V4
	-D LoRaWAN_DEBUG_LEVEL=0
	-D LORAWAN_DEVEUI_AUTO=0
	-D SLOW_CLK_TPYE=0
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0
